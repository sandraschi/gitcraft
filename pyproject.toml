[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitcraft"
version = "0.1.0"
description = "Git and GitHub fleet repository craft workstation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
gitcraft-cli = "gitcraft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gitcraft"]
